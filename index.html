<html data-theme="dim">
    <head><title>Task Tim Toolbox</title>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link href="/global.css" rel="stylesheet" type="text/css" />
        <link href="/gen_assets/icon.png" rel="icon" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />


        <style>
        </style>
    </head>
    <body>
      
        <div class="dock bg-base-300">
            <button id="home-tab" class="dock-active">
                <i class="bi bi-house"></i>            
                <span class="dock-label">Home</span>
            </button>
            
            <button id="meditation-tab" class="animated pulse-slow">
                <i class="bi bi-peace"></i>
                <span class="dock-label">Meditation</span>
            </button>
            
            <button id="rng-tab">
                <i class="bi bi-dice-5" ></i>
                 <span class="dock-label">RNG</span>
            </button>
        </div>

        <!-- Tab content sections -->
        <div id="home-content" class="tab-content active-tab">
            <h1 class="text-2xl font-bold">Welcome to Task Tim Toolbox</h1>
            <p>Select a tool from the dock  to get started.</p>
            <br>
            <p>Check out these tools in dedicated windows</p>
            <a href="./MD/index.html" class="btn btn-primary">Meditation</a>
            <a href="./ sRNG/index.html" class="btn btn-primary">RNG</a>
        </div>

        <div id="meditation-content" class="tab-content">
            <iframe src="./MD/index.html" width="100%" height="200%" frameborder="0"></iframe>
        </div>

        <div id="rng-content" class="tab-content">
            <iframe src="./RNG/index.html" width="100%" height="200%" frameborder="0"></iframe>
        </div>
         <div id="rng-content" class="tab-content">
            <iframe src="./RNG/index.html" width="100%" height="200%" frameborder="0"></iframe>
        </div>

        <script src="global.js"> </script>
    </body>
</html>
