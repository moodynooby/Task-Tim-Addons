<html data-theme="dark">
    <head>
        <title>Meditation</title>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link href="style.css" rel="stylesheet" type="text/css" />
        <link href="../gen_assets/Chill.png" rel="icon" />
    </head>
    <body>
       
    
        <div class="container">
            <header class="header">
                <h1 class="text-5xl"><u><b>Meditation</b></u></h1> 
                <a class="btn btn-info" href="https://mercury-sailor-874.notion.site/Meditation-1d45c51b91c580fe8397d7f27fffed94?pvs=4">Read the docs </a>
            </header>
            <div class="input-container">
                <select class="select select-bordered w-full max-w-xs" id="meditationType">
                    <option disabled selected>Select the meditation</option>
                    <option value="deep-breathing">Deep Breathing</option>
                    <option value="box-breathing">Box Breathing</option>
                </select>
    
                <select class="select select-bordered w-full max-w-xs" id="meditationDuration">
                    <option disabled selected>Select the number of minutes</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="25">25</option>
                    <option value="30">30</option>
                </select>
                
                <button class="btn btn-primary" id="startButton">Start</button>
                </div>
                <div class="video-container " style="display: none;">
                    <video id="meditationVideo" width="520" height="540" loop></video>
                    <div id="timer" class="text-xl"></div>
                </div>
            </div>
        </div>

        <script>
            // Video paths for different meditation types
            const videos = {
                'deep-breathing': 'src/DeepBreathing1.mp4',
                'box-breathing': 'src/BoxBreathing1.mp4'
            };

            // DOM elements
            const meditationType = document.getElementById('meditationType');
            const meditationDuration = document.getElementById('meditationDuration');
            const startButton = document.getElementById('startButton');
            const videoElement = document.getElementById('meditationVideo');
            const videoContainer = document.querySelector('.video-container');
            const timerElement = document.getElementById('timer');

            let countdownInterval;

            // Start meditation when button is clicked
            startButton.addEventListener('click', () => {
                const type = meditationType.value;
                const duration = parseInt(meditationDuration.value);
                
                if (type === 'Select the meditation' || isNaN(duration)) {
                    alert('Please select both a meditation type and duration');
                    return;
                }
                
                // Set video source
                videoElement.src = videos[type];
                
                // Show video container
                videoContainer.style.display = 'block';
                
                // Play video
                videoElement.play();
                
                // Set up timer
                let remainingSeconds = duration * 60;
                updateTimerDisplay(remainingSeconds);
                
                // Clear any existing interval
                if (countdownInterval) clearInterval(countdownInterval);
                
                // Start countdown
                countdownInterval = setInterval(() => {
                    remainingSeconds--;
                    updateTimerDisplay(remainingSeconds);
                    
                    if (remainingSeconds <= 0) {
                        clearInterval(countdownInterval);
                        videoElement.pause();
                        videoContainer.style.display = 'none';
                        alert('Meditation session completed!');
                    }
                }, 1000);
            });

            // Format and display remaining time
            function updateTimerDisplay(seconds) {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                timerElement.textContent = `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
            }
        </script>
    </body>
</html>
